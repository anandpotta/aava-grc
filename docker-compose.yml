services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  web:
    image: node:20-alpine
    working_dir: /app
    ports: ["4200:4200"]
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --proxy-config proxy.conf.json"
    depends_on: [api]
